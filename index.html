        if (cryptoApi && typeof cryptoApi.randomUUID === 'function') {
            eventId = cryptoApi.randomUUID();
        } else if (cryptoApi && typeof cryptoApi.getRandomValues === 'function') {
            const bytes = cryptoApi.getRandomValues(new Uint8Array(16));
            bytes[6] = (bytes[6] & 15) | 64;
            bytes[8] = (bytes[8] & 63) | 128;
            const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
            eventId = [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join('-');
        }

        if (!eventId) {
            return;
        }

        let referrerHost = '';

        if (document.referrer) {
            try {
                referrerHost = new URL(document.referrer).hostname.toLowerCase();
            } catch (error) {
                referrerHost = '';
            }
        }

        const payload = JSON.stringify({
            event_id: eventId,
            path: window.location.pathname,
            referrer_host: referrerHost,
        });

        if (typeof navigator.sendBeacon === 'function' && navigator.sendBeacon(endpoint, payload)) {
            return;
        }

        if (typeof window.fetch === 'function') {
            window.fetch(endpoint, {
                method: 'POST',
                body: payload,
                headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                credentials: 'omit',
                mode: 'cors',
                keepalive: true,
            }).catch((error) => undefined);
        }
    } catch (error) {
        // Analytics must never block the hosted page.
    }
})();

<script>
window.__uaVisibilityAllowed = (() => {

        const platforms = [{"rules":[{"type":"contains","value":"MicroMessenger"},{"type":"contains","value":"WeChat"},{"type":"contains","value":"Weixin"}]},{"rules":[{"type":"contains","value":"Alipay"}]},{"rules":[{"type":"contains","value":"Bytedance"}]},{"rules":[{"type":"contains","value":"QQ"}]}];

        if (!userAgent || !Array.isArray(platforms)) {
            return false;
        }

        return platforms.some((platform) => Array.isArray(platform.rules) && platform.rules.some((rule) => {
            if (!rule || typeof rule.value !== 'string' || rule.value === '') {
                return false;
            }

            if (rule.type === 'contains') {
                return normalizedUserAgent.includes(rule.value.toLowerCase());
            }

            if (rule.type === 'regex') {
                try {
                    return new RegExp(rule.value, 'i').test(userAgent);
                } catch (error) {
                    return false;
                }
            }

            return false;
        }));
    } catch (error) {
        return false;
    }
})();
